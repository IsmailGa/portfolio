<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mikuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FF7EC" />
      <stop offset="100%" stop-color="#39C5BB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="#05080D" stroke="#39C5BB" stroke-width="4" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="84" height="84" rx="20" fill="none" stroke="#162436" stroke-width="2" />

  <!-- 01 Typography -->
  <g fill="none" stroke="url(#mikuGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- '0' -->
    <rect x="22" y="24" width="20" height="28" rx="8" />
    <!-- '1' -->
    <path d="M52 30 L58 24 L58 52" />
  </g>

  <!-- Equalizer soundbars -->
  <g fill="#39C5BB" rx="2">
    <rect x="24" y="62" width="6" height="14" rx="3" fill="#39C5BB" />
    <rect x="34" y="58" width="6" height="22" rx="3" fill="#6FF7EC" />
    <rect x="44" y="54" width="6" height="30" rx="3" fill="#39C5BB" />
    <rect x="54" y="60" width="6" height="18" rx="3" fill="#6FF7EC" />
    <rect x="64" y="64" width="6" height="10" rx="3" fill="#39C5BB" />
  </g>

  <!-- Signature neon pink node -->
  <circle cx="76" cy="26" r="6" fill="#FF6FA5" stroke="#FFFFFF" stroke-width="1.5" filter="url(#glow)" />
</svg>